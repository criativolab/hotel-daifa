<!DOCTYPE html>

  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:linear-gradient(135deg,#2b1d14 0%,#4a3223 55%,#6b4a33 100%);
      color:#f5ede4;display:flex;align-items:center;justify-content:center;padding:24px;

    .card{

      background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);

    p{font-size:1.05rem;line-height:1.6;color:#e5d6c6;margin-bottom:10px}
    .domain{
      display:inline-block;margin-top:22px;padding:8px 18px;border-radius:999px;
      background:rgba(217,167,104,.15);color:#d9a768;font-size:.95rem;font-weight:600;letter-spacing:.3px;
    }
    footer{margin-top:28px;font-size:.8rem;color:#b9a692}
    @media(max-width:480px){.card{padding:36px 20px}h1{font-size:1.5rem}}
  </style>
</head>
<body>
  <main class="card">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 11V8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v3"/>

    <span class="domain">jmachadomoveis.com.br</span>
    <footer>&copy; <span id="y"></span> J Machado Móveis. Todos os direitos reservados.</footer>
  </main>
  <script>document.getElementById('y').textContent=new Date().getFullYear();</script>
</body>
